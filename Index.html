<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gallery-container">
        <!-- Main Image -->
        <div class="main-image">
            <img src="images/image1.jpg" alt="Gallery Image 1" id="current-image">
        </div>

        <!-- Navigation Controls -->
        <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
        <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>

        <!-- Thumbnails -->
        <div class="thumbnails" id="thumbnails-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
